import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"

    alias(libs.plugins.shadow)
}

base {
    archivesName.set("${project.rootProject.name}")
    version = "${project.version}-plugin"
}

repositories {
    mavenCentral()
    maven {
        name = "spigotmc-repo"
        url = "https://hub.spigotmc.org/nexus/content/repositories/snapshots/"
    }
}

dependencies {
    compileOnly("org.spigotmc:spigot-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly(files("../libs/SP-Framework-1.0.0-plugin-base.jar"))
    compileOnly(libs.hibernate.core)
}

tasks {
    runServer {
        minecraftVersion("1.21")
    }
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

// base: shadow configuration만 포함 (JPALib, lang)
tasks.shadowJar {
    archiveClassifier.set("base")
    mergeServiceFiles()
    configurations = [project.configurations.shadow]
}

// all: implementation + shadow 전부 포함
tasks.register("shadowJarAll", ShadowJar) {
    archiveClassifier.set("all")
    from sourceSets.main.output
    configurations = [
            project.configurations.runtimeClasspath,
            project.configurations.shadow
    ]
    mergeServiceFiles()
}

assemble.dependsOn(tasks.shadowJar, tasks.shadowJarAll)

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("plugin.yml") {
        expand "version": project.version,
                "spigot_api_version": project.spigot_api_version
    }
}